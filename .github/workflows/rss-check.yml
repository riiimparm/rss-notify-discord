name: RSS Feed Checker

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read   # writeは不要になる

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore RSS state cache
        uses: actions/cache@v4
        with:
          path: rss-state.json
          key: rss-state       # 固定キーで常に上書き保存される
          restore-keys: rss-state

      - name: Install dependencies
        run: npm install fast-xml-parser node-fetch

      - name: Check RSS feeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-rss.js

      - name: Save RSS state cache
        uses: actions/cache/save@v4
        if: always()   # スクリプトが失敗しても状態を保存する
        with:
          path: rss-state.json
          key: rss-state
